  height_m: 0.6
  # Workspace center expressed in the robot 'base' frame. Measured from TF:
  # base -> table_top = (0.510, -0.110, 0.720). vision_node adds this offset
  # so /robopong/cup_position is genuinely in base.
  center_x_m: 0.510
  center_y_m: -0.110
