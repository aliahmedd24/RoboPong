# =============================================================================
# RoboPong throw profile
# =============================================================================
# Units: joint angles in radians, velocities in rad/s, times in seconds.
#
# Joint names must match the MoveIt group's active joints. The lab UR5e uses
# tf_prefix "arm_" (set in cu_ur5e_bringup/hardware.launch) — hence every joint
# below is arm_<name>. motion_node resolves dict → ordered list at load time
# and fails fast with a clear error on any mismatch.
#
# motion_node refuses to execute /robopong/throw while every throw_waypoint
# leaves the arm at ready_joints (override with ~allow_placeholder:=true).
# =============================================================================

# "Ready to throw" pose — arm starts here before every throw. The first
# segment of the throw trajectory is implicitly: ready_joints (with pan
# overridden by aim) → throw_waypoints[0]. Lab-confirmed; pan_joint is
# overridden by the aim model at throw time.
ready_joints:
  arm_shoulder_pan_joint:   0.005383
  arm_shoulder_lift_joint: -0.868382
  arm_elbow_joint:          2.596068
  arm_wrist_1_joint:       -1.529950
  arm_wrist_2_joint:        1.568467
  arm_wrist_3_joint:        0.060191

# Throw trajectory — list of waypoints the arm passes through AFTER the
# implicit aimed-ready state. Ruckig plans N segments for N waypoints:
#   aimed_ready → wp[0] → wp[1] → ... → wp[N-1]
# Each segment is one state-to-state Ruckig call (boundary conditions taken
# from the two waypoints), then concatenated into one JointTrajectory.
#
# Each entry may set:
#   name           : free-form label, surfaced in throw_debug for tracing.
#   joints         : sparse dict of position targets (rad). Joints not listed
#                    default to ready_joints. Pan is overridden by aim at
#                    runtime.
#   velocities     : sparse dict of velocity targets at this waypoint (rad/s).
#                    Joints not listed default to 0. Sign is explicit —
#                    positive means joint angle increasing through this
#                    waypoint, negative means decreasing. The final waypoint
#                    should usually have all zeros so the arm stops cleanly.
#   accelerations  : sparse dict of acceleration targets (rad/s^2). Optional;
#                    joints not listed default to 0. Almost always leave at 0
#                    — non-zero is only useful if you want the joint still
#                    accelerating (or decelerating) AT this waypoint.
#   duration       : optional float (seconds). When set, the segment ENDING
#                    at this waypoint is pinned to this duration via Ruckig's
#                    minimum_duration. Omit/null to let Ruckig pick the
#                    time-optimal duration.
#
# Lab tuning knob: ~velocity_scale ROS param multiplies every velocity in
# every waypoint at planning time (default 1.0). Useful for slow first throws
# without editing yaml — e.g. roslaunch ... velocity_scale:=0.25 for 1/4 speed.
#
# To capture a waypoint pose: jog the arm via Freedrive, then
#   rostopic echo -n 1 /joint_states
# and copy the joints that should differ from ready_joints into the `joints`
# block here.
throw_waypoints:
  # Trajectory: ready -> release -> follow_through. Direct underarm sweep, no
  # reversal. Active joints are shoulder_lift and wrist_1; elbow is held at
  # ready as a rigid linkage for a reproducible release geometry. Ruckig
  # builds shoulder+wrist velocity through `release` (ball leaves the scoop
  # there) and sheds it hard into `follow_through` — that deceleration is
  # what flings the ball off the scoop.
  #
  # Velocities below are the design target. Joint positions are placeholder
  # starting guesses (derived from the prior windup/abrupt_stop shoulder+wrist
  # values, elbow pinned to ready). They MUST be replaced with lab-captured
  # values before a real ball throw — recapture via Freedrive then
  # `rostopic echo /joint_states -n 1`, paste shoulder_lift and wrist_1 here.
  - name: release            # State B: peak velocity, ball leaves the scoop
    joints:
      arm_shoulder_lift_joint: -0.911224   # placeholder (was windup)
      arm_elbow_joint:          2.596068   # = ready (rigid linkage)
      arm_wrist_1_joint:       -0.230433   # placeholder (was windup)
    velocities:
      arm_shoulder_lift_joint:  2.5        # STILL MOVING — sweeping forward
      arm_wrist_1_joint:        4.0        # STILL MOVING — snap
    accelerations: {}
  - name: follow_through     # State C: arm decelerates to rest past release
    joints:
      arm_shoulder_lift_joint: -1.123900   # placeholder (was abrupt_stop)
      arm_elbow_joint:          2.596068   # = ready (rigid linkage)
      arm_wrist_1_joint:       -0.183295   # placeholder (was abrupt_stop)
    velocities: {}                          # all zero — arm stops
    accelerations: {}

# Aim model:
#   base_angle = atan2(cup_y - base_offset_y, cup_x - base_offset_x) + aim_trim
# base_offset_* is the UR5 base position expressed in the cup_position frame.
# vision_node publishes in the 'base' frame (UR5 pivot at origin), so both
# offsets are 0. If vision ever switches frames, update here accordingly.
aim:
  base_joint_name: arm_shoulder_pan_joint
  base_offset_x: 0.0
  base_offset_y: 0.0
  aim_trim: 0.0

# Safety — throw is rejected if aim-adjusted base angle leaves this range.
# Starter envelope is ±π/2 (180° total arc); tighten once the cup region is
# characterised and any workspace obstructions (tripod, wall) are verified.
safety:
  base_joint_min: -1.5708
  base_joint_max:  1.5708

# Ruckig kinematic limits used by the time-optimal throw planner.
# Lists are indexed by joint_order (sorted alphabetically), then remapped
# to the MoveIt active-joint order at load time. Throw-driving joints get
# higher headroom; everything else is capped conservatively.
ruckig_limits:
  joint_order: [arm_elbow_joint, arm_shoulder_lift_joint, arm_shoulder_pan_joint,
                arm_wrist_1_joint, arm_wrist_2_joint, arm_wrist_3_joint]
  max_velocity:     [3.14, 4.0,  3.14, 6.0,  3.14, 3.14]   # rad/s
  # Elbow max_acceleration raised 5 -> 12 so it can both accelerate to the
  # high release-waypoint velocity AND decelerate hard in follow-through
  # (the deceleration jerk is what flings the ball off the scoop).
  max_acceleration: [12.0, 12.0, 5.0,  15.0, 5.0,  5.0]    # rad/s^2
  # Elbow + wrist_1 max_jerk doubled (20 -> 40 elbow, 50 -> 80 wrist_1) so
  # Ruckig can ramp acceleration faster — both for reaching peak release
  # velocity quickly and for snapping to zero in follow-through (the jerk
  # is what flings the ball).
  max_jerk:         [40.0, 40.0, 20.0, 80.0, 20.0, 20.0]   # rad/s^3