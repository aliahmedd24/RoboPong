# =============================================================================
# RoboPong throw profile
# =============================================================================
# ALL NUMERIC VALUES BELOW ARE PLACEHOLDERS — tune in the lab before enabling.
# motion_node refuses to execute /robopong/throw while every waypoint is
# identical to ready_joints (override with ~allow_placeholder:=true for dry runs).
#
# Units: joint angles in radians, times in seconds.
#
# Joint names must match the MoveIt group's active joints. The lab UR5e uses
# tf_prefix "arm_" (set in cu_ur5e_bringup/hardware.launch) — hence every joint
# below is arm_<name>. motion_node resolves dict → ordered list at load time
# and fails fast with a clear error on any mismatch.
# =============================================================================

# "Ready to throw" pose — arm starts here before every throw.
# Lab-confirmed (captured from /joint_states on the UR5e). pan_joint is
# overridden by the aim model at throw time, so its value here is just a
# neutral starting point.
ready_joints:
  arm_shoulder_pan_joint:  -0.154633
  arm_shoulder_lift_joint: -1.237725
  arm_elbow_joint:          2.560938
  arm_wrist_1_joint:       -1.371239
  arm_wrist_2_joint:        1.376385
  arm_wrist_3_joint:        2.887977

# Throw trajectory — list of JointTrajectoryPoints.
# DEPRECATED: kept only so the placeholder-guard logic still runs. The Ruckig
# planner ignores this block and uses release_joints / follow_through_joints
# below instead.
waypoints:
  - time_from_start: 0.0
    joints: {}
  - time_from_start: 0.5
    joints: {}

# State B — joint angles at the throw release point (ball leaves the scoop).
# Sparse dict: list only joints that differ from ready_joints. Joint VELOCITIES
# at this point are set separately via the ~v_shoulder and ~v_wrist ROS params
# (motion_node), not here. Pan is overridden by the aim model.
#
# To capture: jog the arm to the desired release pose (teach pendant or
# scripts2/move_to_*.sh), then `rostopic echo /joint_states -n 1`.
release_joints:
  arm_shoulder_lift_joint: -0.7377   # TUNE — these values caused a self-collision
  arm_wrist_1_joint:       -0.1712   # TUNE — replace with lab-captured pose

# State C — follow-through pose. Both throw joints decelerate back to zero
# velocity here. Should be a safe pose with no contact and no operator in arc.
# Same sparse-dict format as release_joints.
follow_through_joints:
  arm_shoulder_lift_joint: -0.40     # TUNE
  arm_wrist_1_joint:        0.20     # TUNE

# Aim model:
#   base_angle = atan2(cup_y - base_offset_y, cup_x - base_offset_x) + aim_trim
# base_offset_* is the UR5 base position expressed in the cup_position frame.
# vision_node publishes in the 'base' frame (UR5 pivot at origin), so both
# offsets are 0. If vision ever switches frames, update here accordingly.
aim:
  base_joint_name: arm_shoulder_pan_joint
  base_offset_x: 0.0
  base_offset_y: 0.0
  aim_trim: 0.0

# Safety — throw is rejected if aim-adjusted base angle leaves this range.
# Starter envelope is ±π/2 (180° total arc); tighten once the cup region is
# characterised and any workspace obstructions (tripod, wall) are verified.
safety:
  base_joint_min: -1.5708
  base_joint_max:  1.5708

# Ruckig kinematic limits used by the time-optimal throw planner.
# Lists are indexed by joint name (sorted alphabetically), then remapped
# to the MoveIt active-joint order at load time. shoulder_lift and wrist_1
# get higher headroom because they drive the throw; everything else is
# capped conservatively.
ruckig_limits:
  joint_order: [arm_elbow_joint, arm_shoulder_lift_joint, arm_shoulder_pan_joint,
                arm_wrist_1_joint, arm_wrist_2_joint, arm_wrist_3_joint]
  max_velocity:     [3.14, 4.0,  3.14, 6.0,  3.14, 3.14]   # rad/s
  max_acceleration: [5.0,  12.0, 5.0,  15.0, 5.0,  5.0]    # rad/s^2
  max_jerk:         [20.0, 40.0, 20.0, 50.0, 20.0, 20.0]   # rad/s^3
